name: Deploy Ink Studio to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Verify generators and BMP export
        run: |
          node tests/algorithms.cjs
          node tests/bmp.cjs
      - name: Prepare and verify versioned assets
        run: |
          node tests/pages.cjs
          node scripts/build-pages.cjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .pages
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
