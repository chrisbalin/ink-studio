name: Deploy Ink Studio to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Verify generators and BMP export
        run: |
          node tests/algorithms.cjs
          node tests/bmp.cjs
      - name: Version stylesheet to prevent stale browser caches
        run: |
          node <<'JS'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const hash = crypto.createHash('sha256').update(fs.readFileSync('dist/style.css')).digest('hex').slice(0, 12);
          const html = fs.readFileSync('dist/index.html', 'utf8').replace(/href="style\.css(?:\?[^"\s]*)?"/, 'href="style.css?v=' + hash + '"');
          fs.writeFileSync('dist/index.html', html);
          JS
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
